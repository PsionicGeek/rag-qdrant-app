[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-qdrant-app"
version = "0.1.0"
description = "RAG pipeline with FastAPI, Qdrant and Groq"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.11",
    "sentence-transformers>=3.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    "langchain-text-splitters>=0.3",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
